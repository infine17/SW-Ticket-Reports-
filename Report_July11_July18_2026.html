<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>July 11 - July 18 Report (Unavailable)</title>
    <style>
        body { 
            font-family: 'Courier New', Courier, monospace; 
            background-color: #050505; 
            background-image: 
                linear-gradient(rgba(255, 102, 0, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 102, 0, 0.15) 1px, transparent 1px);
            background-size: 30px 30px;
            animation: scrollGrid 3s linear infinite; 
            padding: 15px; 
            margin: 0; 
            color: #ffffff;
            overflow-x: hidden;
        }
        
      
        .header, .warning-box { 
            position: relative; 
            z-index: 10; 
            background-color: rgba(10, 10, 10, 0.85); 
            border-radius: 8px; 
            backdrop-filter: blur(5px); 
        }
        
        .header { 
            padding: 20px; 
            margin-bottom: 20px; 
            border: 1px solid #ff6600;
            animation: pulseGlow 2.5s ease-in-out infinite alternate; 
        }
        
        .back-btn { color: #ff6600; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 15px; border: 1px solid #ff6600; padding: 5px 10px; border-radius: 4px; text-transform: uppercase; box-shadow: 0 0 5px rgba(255, 102, 0, 0.2); transition: all 0.3s; }
        
        h2 { margin: 0; color: #ff6600; text-shadow: 0 0 10px rgba(255, 102, 0, 0.6); text-transform: uppercase; letter-spacing: 1px; }

        .warning-box { 
            padding: 50px 20px; 
            text-align: center;
            border: 1px solid #ff3333; 
            margin-top: 40px;
            animation: pulseWarning 2s ease-in-out infinite alternate; 
        }
        
        .warning-icon { font-size: 40px; margin-bottom: 15px; text-shadow: 0 0 15px #ff3333; }
        .warning-text { color: #ff3333; font-weight: bold; font-size: 20px; text-shadow: 0 0 8px rgba(255, 51, 51, 0.6); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        .warning-subtext { color: #cccccc; font-size: 14px; max-width: 300px; margin: 0 auto; line-height: 1.5; }

        @keyframes scrollGrid { 0% { background-position: 0px 0px; } 100% { background-position: 30px 30px; } }
        @keyframes scanLaser { 0% { top: -10%; } 100% { top: 110%; } }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 10px rgba(255, 102, 0, 0.1), inset 0 0 5px rgba(255, 102, 0, 0.05); } 100% { box-shadow: 0 0 20px rgba(255, 102, 0, 0.3), inset 0 0 10px rgba(255, 102, 0, 0.1); } }
        @keyframes pulseWarning { 0% { box-shadow: 0 0 10px rgba(255, 51, 51, 0.1), inset 0 0 5px rgba(255, 51, 51, 0.05); } 100% { box-shadow: 0 0 30px rgba(255, 51, 51, 0.4), inset 0 0 15px rgba(255, 51, 51, 0.2); } }
    </style>
</head>
<body>

    <div class="laser"></div>

    <div class="header">
        <a href="index.html" class="back-btn">← System Return</a>
        <h2>Week: July 11 - July 18</h2>
    </div>
    
    <div class="warning-box">
        <div class="warning-icon">⚠️</div>
        <div class="warning-text">Records Not Available</div>
        <div class="warning-subtext">Data for this period was not recorded as per directives from the Head Moderators. System logs empty.</div>
    </div>

</body>
</html>

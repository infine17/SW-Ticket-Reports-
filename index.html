<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SW Ticket Reports - Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;600&display=swap');

        :root {
            --bg-color: #0b0c10;
            --card-bg: rgba(31, 40, 51, 0.7);
            --neon-accent: #66fcf1;
            --neon-dim: #45a29e;
            --text-main: #c5c6c7;
            --text-heading: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(102, 252, 241, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(69, 162, 158, 0.05) 0%, transparent 40%);
            font-family: 'Rajdhani', sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard {
            width: 90%;
            max-width: 900px;
            padding: 50px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(102, 252, 241, 0.15);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(102, 252, 241, 0.05);
            text-align: center;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            color: var(--text-heading);
            font-size: 3.5rem;
            margin: 0 0 10px 0;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(102, 252, 241, 0.4);
        }

        p.subtitle {
            font-size: 1.3rem;
            color: var(--neon-dim);
            margin-bottom: 50px;
            letter-spacing: 1px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
        }

        .card {
            background: linear-gradient(145deg, rgba(31, 40, 51, 0.9), rgba(11, 12, 16, 1));
            padding: 40px 20px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--neon-accent);
            box-shadow: 0 10px 25px rgba(102, 252, 241, 0.2), inset 0 0 10px rgba(102, 252, 241, 0.1);
            color: #fff;
        }

        .card h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            margin: 15px 0 5px 0;
            color: var(--text-heading);
        }

        .card p {
            font-size: 1.1rem;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <h1>SW REPORTS</h1>
        <p class="subtitle">System Analytics & Ticket Tracking</p>

        <div class="grid">
            <!-- UPDATED LINK: Pointing to the new exact file name -->
            <a href="Report_July19_July26_2026.html" class="card">
                <h2>JULY 19 - JULY 26</h2>
                <p>View Weekly Report</p>
            </a>
            
            <!-- Placeholder for future reports -->
            <a href="#" class="card" style="opacity: 0.4; cursor: default;">
                <h2>JULY 26 - AUG 02</h2>
                <p>Data Pending</p>
            </a>
        </div>
    </div>

</body>
</html>

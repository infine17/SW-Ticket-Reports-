<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spider's Web Reports</title>
    <style>
        body { 
            font-family: 'Courier New', Courier, monospace; 
            background-color: #050505; 
            /* The Grid */
            background-image: 
                linear-gradient(rgba(255, 102, 0, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 102, 0, 0.15) 1px, transparent 1px);
            background-size: 30px 30px;
            /* ANIMATION 1: This makes the grid scroll continuously */
            animation: scrollGrid 3s linear infinite; 
            text-align: center; 
            padding: 20px; 
            color: #ffffff;
            margin: 0;
            overflow-x: hidden;
        }
        
        /* ANIMATION 2: The sweeping scanner laser */
        .laser {
            position: fixed;
            top: -10%; left: 0; width: 100%; height: 2px;
            background: #ff6600;
            box-shadow: 0 0 15px #ff6600, 0 0 30px #ff6600;
            opacity: 0.6;
            animation: scanLaser 4s linear infinite;
            pointer-events: none;
            z-index: 1000;
        }

        .dashboard { 
            position: relative;
            z-index: 10;
            background-color: rgba(10, 10, 10, 0.85); 
            max-width: 400px; 
            margin: 30px auto; 
            padding: 30px; 
            border-radius: 12px; 
            border: 1px solid #ff6600;
            /* ANIMATION 3: The breathing neon glow */
            animation: pulseGlow 2s ease-in-out infinite alternate;
            backdrop-filter: blur(5px);
        }
        
        h1 { 
            margin: 0 0 10px 0; 
            color: #ff6600; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 102, 0, 0.8);
        }
        .subtitle { color: #cccccc; margin-bottom: 25px; font-size: 14px; }
        
        .btn { 
            display: block; 
            background-color: transparent; 
            color: #ff6600; 
            padding: 15px; 
            margin-bottom: 15px; 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: bold; 
            border: 2px solid #ff6600;
            box-shadow: 0 0 10px rgba(255, 102, 0, 0.3);
            text-transform: uppercase;
            transition: all 0.3s;
        }
        
        .btn:hover, .btn:active {
            background-color: rgba(255, 102, 0, 0.1);
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.5);
        }

        /* --- THE ANIMATION ENGINES --- */
        @keyframes scrollGrid {
            0% { background-position: 0px 0px; }
            100% { background-position: 30px 30px; }
        }
        @keyframes scanLaser {
            0% { top: -10%; }
            100% { top: 110%; }
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(255, 102, 0, 0.1), inset 0 0 10px rgba(255, 102, 0, 0.05); }
            100% { box-shadow: 0 0 25px rgba(255, 102, 0, 0.4), inset 0 0 20px rgba(255, 102, 0, 0.15); }
        }
    </style>
</head>
<body>
    
    <!-- The sweeping laser line -->
    <div class="laser"></div>
    
    <div class="dashboard">
        <h1>Ticket Reports</h1>
        <p class="subtitle">Spider's Web Official Database</p>

        <a href="Report_July19_July26_2026.html" class="btn">July 19 - July 26</a>
        <a href="Report_July4_July10_2026.html" class="btn">July 4 - July 10</a>
        <a href="Report_June27_July3_2026.html" class="btn">June 27 - July 3</a>
        <a href="Report_June20_June26_2026.html" class="btn">June 20 - June 26</a>
        <a href="Report_June14_June20_2026.html" class="btn">June 14 - June 20</a>
        <a href="Report_June9_June15_2026.html" class="btn">June 9 - June 15</a>
    </div>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SW Ticket Reports - Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap');

        :root {
            --bg-pitch-black: #000000;
            --neon-orange: #ff5e00;
            --neon-orange-dim: #993800;
            --text-main: #e0e0e0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-pitch-black);
            font-family: 'Share Tech Mono', monospace;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Animated Tech Grid Background */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 200vw; height: 200vh;
            background-image: 
                linear-gradient(rgba(255, 94, 0, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 94, 0, 0.15) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -2;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 15s linear infinite;
        }

        /* Glowing Center Orb */
        body::after {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,94,0,0.15) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(40px) translateZ(-200px); }
        }

        .dashboard {
            width: 90%;
            max-width: 950px;
            padding: 50px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            border: 2px solid var(--neon-orange-dim);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(255, 94, 0, 0.2), inset 0 0 20px rgba(255, 94, 0, 0.1);
            text-align: center;
            position: relative;
        }

        /* Tech corner accents */
        .dashboard::before, .dashboard::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border: 3px solid var(--neon-orange);
            pointer-events: none;
        }
        .dashboard::before { top: -3px; left: -3px; border-right: none; border-bottom: none; }
        .dashboard::after { bottom: -3px; right: -3px; border-left: none; border-top: none; }

        h1 {
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            font-size: 4rem;
            font-weight: 900;
            margin: 0 0 5px 0;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--neon-orange), 0 0 20px var(--neon-orange);
        }

        p.subtitle {
            font-size: 1.2rem;
            color: var(--neon-orange);
            margin-bottom: 50px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .card {
            background: #050505;
            padding: 40px 20px;
            border: 1px solid var(--neon-orange-dim);
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        /* Animated border pulse on hover */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 2px;
            background: var(--neon-orange);
            transition: all 0.4s ease;
        }

        .card:hover {
            transform: scale(1.05);
            border-color: var(--neon-orange);
            box-shadow: 0 0 25px rgba(255, 94, 0, 0.4);
            background: #0a0a0a;
        }

        .card:hover::before {
            left: 0;
        }

        .card h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            margin: 15px 0 10px 0;
            color: #fff;
            text-shadow: 0 0 5px var(--neon-orange);
        }

        .card p {
            font-size: 1.1rem;
            margin: 0;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <h1>SW REPORTS</h1>
        <p class="subtitle">>>> SYSTEM ANALYTICS & TICKET TRACKING <<<</p>

        <div class="grid">
            <a href="Report_July19_July26_2026.html" class="card">
                <h2>JULY 19 - JULY 26</h2>
                <p>ACCESS DATA LOG</p>
            </a>
            
            <a href="#" class="card" style="opacity: 0.3; cursor: not-allowed; border-color: #333;">
                <h2 style="color: #555; text-shadow: none;">JULY 26 - AUG 02</h2>
                <p>ENCRYPTED / PENDING</p>
            </a>
        </div>
    </div>

</body>
</html>

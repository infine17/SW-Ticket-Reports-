<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>June 9 - June 15 Report</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #050505; background-image: linear-gradient(rgba(255, 102, 0, 0.15) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 102, 0, 0.15) 1px, transparent 1px); background-size: 30px 30px; animation: scrollGrid 3s linear infinite; padding: 15px; margin: 0; color: #ffffff; overflow-x: hidden; }
        .laser { position: fixed; top: -10%; left: 0; width: 100%; height: 2px; background: #ff6600; box-shadow: 0 0 15px #ff6600, 0 0 30px #ff6600; opacity: 0.6; animation: scanLaser 4s linear infinite; pointer-events: none; z-index: 1000; }
        .header, .card, table { position: relative; z-index: 10; background-color: rgba(10, 10, 10, 0.85); border-radius: 8px; border: 1px solid #ff6600; backdrop-filter: blur(5px); }
        .header { padding: 20px; margin-bottom: 20px; animation: pulseGlow 2.5s ease-in-out infinite alternate; }
        .back-btn { color: #ff6600; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 15px; border: 1px solid #ff6600; padding: 5px 10px; border-radius: 4px; text-transform: uppercase; box-shadow: 0 0 5px rgba(255, 102, 0, 0.2); transition: all 0.3s; }
        h2 { margin: 0; color: #ff6600; text-shadow: 0 0 10px rgba(255, 102, 0, 0.6); text-transform: uppercase; letter-spacing: 1px; }
        .card { padding: 15px; margin-bottom: 20px; animation: pulseGlow 2s ease-in-out infinite alternate-reverse; }
        .highlight { color: #ff6600; font-weight: bold; font-size: 18px; text-shadow: 0 0 5px rgba(255, 102, 0, 0.5); }
        table { width: 100%; border-collapse: collapse; overflow: hidden; animation: pulseGlow 3s ease-in-out infinite alternate; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #222; font-size: 14px; }
        th { background-color: rgba(255, 102, 0, 0.1); color: #ff6600; font-size: 12px; text-transform: uppercase; border-bottom: 1px solid #ff6600; }
        .bar-bg { width: 100%; background: #111; border-radius: 3px; height: 10px; border: 1px solid #333; }
        .bar-fill { background: #ff6600; height: 10px; border-radius: 3px; box-shadow: 0 0 8px #ff6600; }
        @keyframes scrollGrid { 0% { background-position: 0px 0px; } 100% { background-position: 30px 30px; } }
        @keyframes scanLaser { 0% { top: -10%; } 100% { top: 110%; } }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 10px rgba(255, 102, 0, 0.1), inset 0 0 5px rgba(255, 102, 0, 0.05); } 100% { box-shadow: 0 0 20px rgba(255, 102, 0, 0.3), inset 0 0 10px rgba(255, 102, 0, 0.1); } }
    </style>
</head>
<body>
    <div class="laser"></div>
    <div class="header">
        <a href="index.html" class="back-btn">← System Return</a>
        <h2>Week: June 9 - June 15</h2>
    </div>
    <div class="card">
        <strong>Total Tickets Solved:</strong> <span class="highlight">273</span> <br><br>
        <strong>Active Mods:</strong> <span class="highlight">5</span>
    </div>
    <table>
        <tr><th>Moderator</th><th>Tickets</th><th>Volume</th></tr>
        <tr><td><strong>Infine</strong></td><td>114</td><td><div class="bar-bg"><div class="bar-fill" style="width: 100%;"></div></div></td></tr>
        <tr><td><strong>Kaido</strong></td><td>91</td><td><div class="bar-bg"><div class="bar-fill" style="width: 79%;"></div></div></td></tr>
        <tr><td><strong>Arxeus</strong></td><td>32</td><td><div class="bar-bg"><div class="bar-fill" style="width: 28%;"></div></div></td></tr>
        <tr><td><strong>Shubham</strong></td><td>27</td><td><div class="bar-bg"><div class="bar-fill" style="width: 23%;"></div></div></td></tr>
        <tr><td><strong>Keiarise</strong></td><td>9</td><td><div class="bar-bg"><div class="bar-fill" style="width: 7%;"></div></div></td></tr>
    </table>
</body>
</html>
